apiVersion: 1

datasources:
  - name: ClickHouse
    uid: movie-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana_reader
      defaultDatabase: movie_analytics
      defaultTable: daily_metrics
    secureJsonData:
      password: local-grafana
